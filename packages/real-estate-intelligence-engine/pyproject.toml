[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-intelligence-engine"
version = "0.1.0"
description = "Enterprise-grade Indian real estate scraping, enrichment, normalization, media, and monitoring engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "JameenWallah Data Intelligence" }]
dependencies = [
  "requests>=2.31",
  "urllib3<2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.44",
  "selenium>=4.20",
]
scrapy = [
  "scrapy>=2.11",
]
pdf = [
  "pypdf>=4.0",
  "pillow>=10.0",
]
vision = [
  "pillow>=10.0",
  "opencv-python>=4.9",
]
stores = [
  "pymongo>=4.6",
  "psycopg[binary]>=3.1",
  "elasticsearch>=8.12",
  "redis>=5.0",
]
ai = [
  "sentence-transformers>=2.7",
]

[project.scripts]
rei = "rei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
